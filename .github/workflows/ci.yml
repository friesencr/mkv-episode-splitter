name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config ffmpeg libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check shell scripts
        run: for script in *.sh packaging/*.sh tests/*.sh; do bash -n "$script" || exit 1; done

  standalone:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Validate release tag
        if: github.ref_type == 'tag'
        id: tag
        run: |
          prerelease=$(bash packaging/release-tag.sh "$GITHUB_REF_NAME")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and test the static CLI, including a split in an empty container
        run: docker build --platform linux/amd64 -f packaging/Dockerfile --output type=local,dest=dist .
      - name: Package corresponding sources and checksums
        if: github.ref_type == 'tag'
        id: package
        run: |
          bash packaging/source-archive.sh "$GITHUB_REF_NAME" dist
          echo "manifest=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [test, standalone]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Publish the tested files
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.standalone.outputs.prerelease }}
          TESTED_COMMIT: ${{ needs.standalone.outputs.commit }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$TESTED_COMMIT"
          sha256sum -c SHA256SUMS
          latest=true
          notes='Standalone Linux x86-64 CLI. Download the binary and SHA256SUMS, check its SHA-256, then run chmod +x on the binary. The binary includes FFmpeg under LGPL 2.1 or later. The source archive includes matching sources, license notices, and rebuild instructions.'
          if [[ $PRERELEASE == true ]]; then
            latest=false
            notes+=$'\n\nTesting prerelease. CI exercised synthetic MKVs, packet timing, chapter selection, gap detection, write failures, and a split in an empty Linux container. On real disc rips, please report expected and actual episode boundaries, audio and subtitle track preservation, and playback timing.'
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ $draft == false ]]; then exit 0; fi
          else
            gh release create "$tag" --draft --verify-tag --title "$tag" --generate-notes --notes "$notes" --prerelease="$PRERELEASE"
          fi
          gh release upload "$tag" --clobber mkvsplit-cli-linux-x86_64 *-source.tar.gz LICENSES.txt SHA256SUMS
          gh release edit "$tag" --draft=false --prerelease="$PRERELEASE" --latest="$latest"

  verify-download:
    needs: [standalone, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public release downloads against the build manifest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.standalone.outputs.manifest }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist
          cd dist
          echo "$EXPECTED_MANIFEST  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
      - name: Split with the downloaded binary in a fresh scratch container
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          bash packaging/smoke-download.sh dist/mkvsplit-cli-linux-x86_64
